source: pharma-observations
db_env: FD_OPEN_DATA_MCP_DATABASE_URL
object: semantic_observations[concept in 医药四概念]
report_only: false
expected_source: >-
  fd-industry-data/scripts/extract_pharma.py（把 clinicaltrials-cn / nrdl-national-catalog
  的 crawl_items 抽成概念观测）
checks:
  - kind: missing_entity
    table: semantic_observations
    # 概念 code 作为"实体"来巡检：四个概念每个都必须至少有一条观测。
    # 这条存在的理由很具体——采集层有 48xx 行数据而观测层零行时，任何按概念检索的产品
    # 查询都查不到医药域，而 crawl_* 侧的巡检是全绿的（add-pharma-observation-extraction）。
    entity_col: "(SELECT code FROM concepts c WHERE c.id = concept_id)"
    expected:
      - trial.new
      - trial.enrollment.planned
      - catalog.drug.entries
      - catalog.drug.class_a_share
    where: "source_used IN ('clinicaltrials-cn', 'nrdl-national-catalog')"
    severity: critical
    note: 医药四概念观测覆盖；缺哪个概念会在 key_space 里点名
  - kind: staleness
    table: semantic_observations
    key_cols: [concept_id]
    period_col: date
    period_type: date
    where: >-
      source_used IN ('clinicaltrials-cn', 'nrdl-national-catalog')
      AND (SELECT code FROM concepts c WHERE c.id = concept_id) = 'trial.new'
    expected_max: auto
    # 试验源按月窗口增量抓取（每轮回溯一个月），加上排期间隔，45 天是可接受的滞后上限。
    allow_lag: 45
    critical_mult: 2
    severity: warn
    note: 月度试验计数停更（目录是年度版，单独由目录源巡检管）
  # 抽取器**存活**（change schedule-pharma-observation-extraction）。
  # 必须是 freshness 而不是 staleness：staleness 的参照物是「本表内数据自身的最大值」，
  # 抽取器停摆后参照物一起停在旧时刻，lag 恒为 0 —— 门永远绿（死门）。freshness 拿水位
  # 对 wall clock，才答得出"上次成功抽取是多久以前"。
  # 与上面 trial.new 那条的分工：这条答"抽取器还活着吗"，那条答"数据新不新"。
  # 抽取失败时台账写 status='failed'，所以只有 success 才代表存活。
  - kind: freshness
    table: executions
    period_col: started_at
    period_type: timestamp
    where: "status = 'success'"
    # 日更一次 + 半天缓冲：36 小时（=1.5 天）没成功过一次就是问题，
    # 与"上游没新数据"无关——那是上面那条管的。
    max_age_days: 1.5
    severity: critical
    note: 医药观测抽取器停摆（CronJob fd-pharma-observations）——按 executions 台账判，不看数据涨没涨
  # 单位不得为空（change fix-concept-freshness-window）。predicate 写的是**违规形态**：
  # 抽取器曾把 unit 写死 NULL，读侧拿到 unit: null 却一切"跑得通"，只有消费方看出不对。
  # 有了这条，退化成 NULL 会在下一轮巡检里点名。
  - kind: data_quality
    table: semantic_observations
    predicate: "unit IS NULL"
    where: >-
      concept_id IN (SELECT id FROM concepts WHERE source = 'pharma-domain-stack')
    severity: warn
    note: 医药观测缺单位（应为 count/persons/percent）
