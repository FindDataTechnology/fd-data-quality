source: pharma-nrdl-national-catalog
db_env: FD_OPEN_DATA_MCP_DATABASE_URL
object: crawl_runs/crawl_items[source=nrdl-national-catalog]
report_only: false
expected_source: spiders/nrdl-national-catalog（国家医保局目录 PDF 附件，年度版）
checks:
  - kind: staleness
    table: crawl_runs
    key_cols: [source]
    period_col: started_at
    period_type: timestamp
    where: "source = 'nrdl-national-catalog' AND status = 'success'"
    expected_max: auto
    allow_lag: 1
    critical_mult: 2
    severity: warn
    note: 年度目录未重灌（新版目录通常 12 月发布、次年 1 月执行）
  - kind: row_count
    table: crawl_items
    where: >-
      run_id IN (SELECT id FROM crawl_runs WHERE source = 'nrdl-national-catalog'
      AND status = 'success')
    min_rows: 3900
    severity: critical
    note: >-
      落地行下限 3900：2025 年版实测 3911 行（西药 1446 + 中成药 1335 + 谈判药品
      472 的唯一品种编号，行数含 ★ 剂型变体）。若谈判段解析塌陷会低于此值——这是
      解析退化的直接信号。条目数的硬判据在单元内部（对凡例 1446/1335/472 逐数比对），
      此处只兜住"整份没落下来"这一层
