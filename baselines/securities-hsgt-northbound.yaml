source: securities-hsgt-northbound
db_env: FD_OPEN_DATA_MCP_DATABASE_URL
object: fd_open_data.semantic_observations[hsgt 2560-2562]
report_only: false
expected_source: spiders/hsgt-northbound（北向资金；交易日 19:50 UTC）
checks:
  - kind: freshness
    table: semantic_observations
    period_col: date
    period_type: date
    where: "concept_id IN (2560,2561,2562)"
    max_age_days: 7
    severity: critical
    note: 北向资金日更停更（buy/sell 自 2024-08-16 官方停止披露，本检查只看 total_turnover 与既有键的产出节奏）
  - kind: row_count
    table: semantic_observations
    where: "concept_id IN (2560,2561,2562)"
    min_rows: 1
    severity: critical
    note: 北向族行数规模（点亮前预期缺口）
